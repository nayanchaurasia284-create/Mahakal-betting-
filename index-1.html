<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>91 CLUB - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;max-width:430px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#c0392b 0%,#7b241c 100%);display:flex;flex-direction:column}
.top{padding:44px 24px 28px;text-align:center}
.logo{width:72px;height:72px;border-radius:50%;background:#fff;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.logo span{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;color:#c0392b}
.app-title{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;color:#fff;letter-spacing:2px}
.app-title b{color:#ffd700}
.app-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:5px}
.card{background:#fff;border-radius:24px 24px 0 0;flex:1;padding:28px 22px 40px}
.tabs{display:flex;background:#f5f5f5;border-radius:12px;padding:4px;margin-bottom:22px}
.tab{flex:1;padding:11px;text-align:center;border-radius:9px;font-size:14px;font-weight:800;color:#aaa;cursor:pointer;transition:.2s}
.tab.active{background:#c0392b;color:#fff;box-shadow:0 4px 12px rgba(192,57,43,.3)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:#888;margin-bottom:6px;font-weight:700}
.field input{width:100%;background:#f8f8f8;border:1.5px solid #eee;border-radius:12px;padding:13px 15px;color:#111;font-size:14px;font-family:'Nunito',sans-serif;outline:none;transition:.2s}
.field input:focus{border-color:#c0392b;background:#fff}
.field input::placeholder{color:#ccc}
.submit-btn{width:100%;padding:15px;background:linear-gradient(135deg,#f1402f,#c0392b);border:none;border-radius:13px;color:#fff;font-size:16px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;margin-top:4px;box-shadow:0 6px 20px rgba(192,57,43,.35);transition:.15s}
.submit-btn:active{transform:scale(.97)}
.err{color:#c0392b;font-size:12px;text-align:center;margin-top:10px;min-height:18px;font-weight:600}
.admin-link{text-align:center;margin-top:18px;font-size:12px;color:#aaa}
.admin-link span{color:#c0392b;font-weight:700;cursor:pointer}
.loader{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:999}
.loader.show{display:flex}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><span>91</span></div>
  <div class="app-title">91<b>CLUB</b></div>
  <div class="app-sub">India's #1 Color Prediction Game 🎯</div>
</div>
<div class="card">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('login',this)">Log In</div>
    <div class="tab" onclick="switchTab('register',this)">Register</div>
  </div>
  <div id="loginForm">
    <div class="field"><label>📱 Phone Number</label><input type="tel" id="lPhone" placeholder="+91 9876543210"></div>
    <div class="field"><label>🔒 Password</label><input type="password" id="lPass" placeholder="Enter password"></div>
    <button class="submit-btn" onclick="doLogin()">Log In →</button>
  </div>
  <div id="regForm" style="display:none">
    <div class="field"><label>👤 Full Name</label><input type="text" id="rName" placeholder="Your full name"></div>
    <div class="field"><label>📱 Phone Number</label><input type="tel" id="rPhone" placeholder="+91 9876543210"></div>
    <div class="field"><label>🔒 Password</label><input type="password" id="rPass" placeholder="Min 6 characters"></div>
    <div class="field"><label>🎁 Referral Code (optional)</label><input type="text" id="rRef" placeholder="Enter referral code"></div>
    <button class="submit-btn" onclick="doRegister()">Create Account →</button>
  </div>
  <div class="err" id="errMsg"></div>
  <div class="admin-link">Admin? <span onclick="adminLogin()">Admin Login</span></div>
</div>
<div class="loader" id="loader"><div class="spinner"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const app = initializeApp({
  apiKey:"AIzaSyDB_ymNmTN9eFoY9amgRbLJoeTjRzF61HE",
  authDomain:"club-5d681.firebaseapp.com",
  projectId:"club-5d681",
  storageBucket:"club-5d681.firebasestorage.app",
  messagingSenderId:"424424836125",
  appId:"1:424424836125:web:5ca5709b23bcea63228af4"
});
const db = getFirestore(app);
const auth = getAuth(app);

const load = v => document.getElementById('loader').classList.toggle('show', v);
const err = m => document.getElementById('errMsg').textContent = m;
const p2e = p => p.replace(/[^0-9]/g,'') + '@91club.app';

onAuthStateChanged(auth, async user => {
  if (!user) return;
  try {
    const snap = await getDoc(doc(db,'users',user.uid));
    if (snap.exists()) {
      const d = snap.data();
      sessionStorage.setItem('cu', JSON.stringify({uid:user.uid,...d}));
      window.location.href = d.isAdmin ? 'admin.html' : 'home.html';
    }
  } catch(e){}
});

window.switchTab = (tab, el) => {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('loginForm').style.display = tab==='login'?'block':'none';
  document.getElementById('regForm').style.display = tab==='register'?'block':'none';
  err('');
};

window.doLogin = async () => {
  const phone = document.getElementById('lPhone').value.trim();
  const pass = document.getElementById('lPass').value;
  if (!phone||!pass) { err('Fill all fields'); return; }
  load(true);
  try {
    const c = await signInWithEmailAndPassword(auth, p2e(phone), pass);
    const snap = await getDoc(doc(db,'users',c.user.uid));
    if (snap.exists()) {
      const d = snap.data();
      sessionStorage.setItem('cu', JSON.stringify({uid:c.user.uid,...d}));
      window.location.href = d.isAdmin ? 'admin.html' : 'home.html';
    }
  } catch(e) { load(false); err('❌ Wrong phone or password'); }
};

window.doRegister = async () => {
  const name = document.getElementById('rName').value.trim();
  const phone = document.getElementById('rPhone').value.trim();
  const pass = document.getElementById('rPass').value;
  const ref = document.getElementById('rRef').value.trim().toUpperCase();
  if (!name||!phone||!pass) { err('Fill all fields'); return; }
  if (pass.length<6) { err('Password minimum 6 characters'); return; }
  load(true);
  try {
    const c = await createUserWithEmailAndPassword(auth, p2e(phone), pass);
    const uid = c.user.uid;
    const refCode = 'REF'+Math.floor(Math.random()*90000+10000);
    const ud = { uid, name, phone, balance:100, xp:0, vip:0, refCode, referredBy:ref, joinDate:new Date().toLocaleDateString('en-IN'), isAdmin:false, createdAt:new Date().toISOString() };
    await setDoc(doc(db,'users',uid), ud);
    if (ref) {
      const q = query(collection(db,'users'), where('refCode','==',ref));
      const sn = await getDocs(q);
      for (const d of sn.docs) await updateDoc(doc(db,'users',d.id), {balance:increment(50),xp:increment(100)});
    }
    sessionStorage.setItem('cu', JSON.stringify(ud));
    window.location.href = 'home.html';
  } catch(e) {
    load(false);
    err(e.code==='auth/email-already-in-use' ? '❌ Phone already registered' : '❌ '+e.message);
  }
};

window.adminLogin = async () => {
  const pass = prompt('🔐 Admin Password:');
  if (!pass) return;
  if (pass !== 'admin123') { err('❌ Wrong admin password'); return; }
  load(true);
  try {
    const c = await signInWithEmailAndPassword(auth, 'admin@91club.app', 'admin123');
    const snap = await getDoc(doc(db,'users',c.user.uid));
    if (snap.exists()) {
      sessionStorage.setItem('cu', JSON.stringify({uid:c.user.uid,...snap.data()}));
      window.location.href = 'admin.html';
    }
  } catch(e) {
    // Create admin if not exists
    try {
      const c2 = await createUserWithEmailAndPassword(auth, 'admin@91club.app', 'admin123');
      const ad = { uid:c2.user.uid, name:'Admin', phone:'admin', balance:999999, xp:999999, vip:5, refCode:'ADMIN1', referredBy:'', joinDate:new Date().toLocaleDateString('en-IN'), isAdmin:true, createdAt:new Date().toISOString() };
      await setDoc(doc(db,'users',c2.user.uid), ad);
      sessionStorage.setItem('cu', JSON.stringify(ad));
      window.location.href = 'admin.html';
    } catch(e2) { load(false); err('❌ '+e2.message); }
  }
};
</script>
</body>
</html>
